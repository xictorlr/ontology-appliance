[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ontology-appliance-semantic-gateway"
version = "0.1.0"
description = "Read-only semantic runtime for Ontology Appliance"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "rdflib>=7.1,<8",
  "pyshacl>=0.30,<1",
  "pyyaml>=6,<7",
  "owlrl>=7.1,<8",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
firebase = [
  "firebase-admin>=6.8,<8",
  "google-cloud-storage>=3,<4",
]
vertex = ["google-genai>=1.30,<3"]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "truststore>=0.10,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_appliance_gateway"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ontology_appliance_gateway"]

[tool.ruff]
target-version = "py312"
line-length = 100
