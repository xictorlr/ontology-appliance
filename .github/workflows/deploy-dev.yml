name: Deploy dev backends

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Bootstrap creates the gateway secret; backend adds Functions/rules; full requires App Hosting
        required: true
        type: choice
        options: [full, backend, bootstrap]
        default: full
      semantic_mode:
        description: Serve the labeled demo candidate or an already Publisher-promoted release
        required: true
        type: choice
        options: [candidate, published]
        default: candidate

permissions:
  contents: read
  id-token: write

concurrency:
  group: ontology-dev-mutation
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository_owner != 'example' &&
      (vars.CLOUD_DEPLOY_ENABLED == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deployment_scope != 'full')) &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: development
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOYMENT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_scope || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Refuse a replay of historical main
        env:
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: bash scripts/assert_current_main.sh
      - name: Validate environment-scoped deployment configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          ARTIFACT_REGISTRY_IMAGE: ${{ vars.ARTIFACT_REGISTRY_IMAGE }}
          GATEWAY_SERVICE_ACCOUNT: ${{ vars.GATEWAY_SERVICE_ACCOUNT }}
          APPHOSTING_SERVICE_ACCOUNT: ${{ vars.APPHOSTING_SERVICE_ACCOUNT }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}
          INPUT_BUCKET: ${{ vars.INPUT_BUCKET }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          APP_HOSTING_URL: ${{ vars.APP_HOSTING_URL }}
        run: |
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT ARTIFACT_REGISTRY_IMAGE \
            GATEWAY_SERVICE_ACCOUNT APPHOSTING_SERVICE_ACCOUNT \
            FUNCTIONS_SERVICE_ACCOUNT INPUT_BUCKET ARTIFACT_BUCKET; do
            test -n "${!name}" || { echo "Missing environment variable: $name" >&2; exit 1; }
          done
          if [[ "$DEPLOYMENT_SCOPE" == "full" ]]; then
            test -n "$APP_HOSTING_URL" || { echo "APP_HOSTING_URL is required for a full deploy." >&2; exit 1; }
            [[ "$APP_HOSTING_URL" == https://* ]]
          elif [[ "${{ inputs.semantic_mode }}" == "published" ]]; then
            echo "A partial deployment cannot activate published semantics." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Verify Firebase conditional IAM compatibility
        run: pnpm firebase:iam-v3:check
      - name: Re-run release gates on the exact revision
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: pnpm verify
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.11.30"
          enable-cache: true
          prune-cache: true
      - name: Verify semantic gateway
        working-directory: services/semantic-gateway
        run: |
          uv sync --dev --extra firebase --extra cloud-function --frozen
          uv run ruff check . ../../scripts/check_semantic_publication.py ../../scripts/export_publication_review.py ../../scripts/manage_semantic_rollback.py
          uv run pytest
      - name: Build gateway image without cloud credentials
        run: >-
          docker build
          --file services/semantic-gateway/Dockerfile
          --tag "${{ vars.ARTIFACT_REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}"
          .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Preserve governed semantic publication state
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REQUESTED_SEMANTIC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.semantic_mode || '' }}
        run: bash scripts/resolve_deploy_semantic_mode.sh
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
      - name: Push prebuilt gateway image
        run: docker push "${{ vars.ARTIFACT_REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}"
      - name: Stage Cloud Functions gateway source
        id: gateway_function_source
        shell: bash
        run: |
          function_source="${RUNNER_TEMP}/semantic-gateway-function"
          mkdir -p "$function_source/gateway" "$function_source/semantic/artifacts"
          cp services/semantic-gateway/src/ontology_appliance_gateway/cloud_function.py \
            "$function_source/main.py"
          cp services/semantic-gateway/pyproject.toml "$function_source/gateway/pyproject.toml"
          cp -R services/semantic-gateway/src "$function_source/gateway/src"
          cp -R semantic/artifacts/. "$function_source/semantic/artifacts/"
          uv export \
            --project services/semantic-gateway \
            --frozen \
            --no-dev \
            --extra firebase \
            --extra cloud-function \
            --no-emit-project \
            --no-hashes \
            --quiet \
            --output-file "$function_source/requirements.txt"
          printf '\n./gateway\n' >> "$function_source/requirements.txt"
          echo "path=$function_source" >> "$GITHUB_OUTPUT"
      - name: Deploy private demo-candidate gateway function
        if: env.SEMANTIC_MODE == 'candidate'
        run: >-
          gcloud functions deploy semanticGatewayHttp
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region europe-west4
          --gen2
          --runtime python312
          --source "${{ steps.gateway_function_source.outputs.path }}"
          --entry-point semantic_gateway
          --trigger-http
          --no-allow-unauthenticated
          --ingress-settings all
          --min-instances 0
          --max-instances 3
          --cpu 1
          --memory 512Mi
          --concurrency 8
          --timeout 30
          --run-service-account "${{ vars.GATEWAY_SERVICE_ACCOUNT }}"
          --update-labels "release-sha=${{ env.RELEASE_SHA }}"
          --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},OA_ENV=production,OA_ARTIFACT_DIR=/workspace/semantic/artifacts,OA_LAST_VALID_PATH=/tmp/ontology-appliance/last-valid.trig,OA_AUTH_MODE=hybrid,OA_SERVICE_AUDIENCE=https://europe-west4-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/semanticGatewayHttp,OA_TRUSTED_SERVICE_ACCOUNTS=${{ vars.FUNCTIONS_SERVICE_ACCOUNT }},OA_TENANT_ID=demo-bank,OA_ALLOW_DEMO_CANDIDATE=true,OA_SEMANTIC_TIMEOUT_SECONDS=5,OA_MAX_SEMANTIC_CONCURRENCY=2,VERIFIER_PROVIDER=mock,OPENAI_VERIFIER_MODE=mock,GENERATOR_PROVIDER=mock"
      - name: Deploy private published gateway function
        if: env.SEMANTIC_MODE == 'published'
        run: >-
          gcloud functions deploy semanticGatewayHttp
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region europe-west4
          --gen2
          --runtime python312
          --source "${{ steps.gateway_function_source.outputs.path }}"
          --entry-point semantic_gateway
          --trigger-http
          --no-allow-unauthenticated
          --ingress-settings all
          --min-instances 0
          --max-instances 3
          --cpu 1
          --memory 512Mi
          --concurrency 8
          --timeout 30
          --run-service-account "${{ vars.GATEWAY_SERVICE_ACCOUNT }}"
          --update-labels "release-sha=${{ env.RELEASE_SHA }}"
          --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }},ONTOLOGY_ARTIFACT_BUCKET=${{ vars.ARTIFACT_BUCKET }},ONTOLOGY_ARTIFACT_POINTER=tenants/demo-bank/ontology/active.json,OA_ACTIVE_POINTER_GENERATION=${{ env.ACTIVE_POINTER_GENERATION }},OA_ENV=production,OA_ARTIFACT_DIR=/workspace/semantic/artifacts,OA_LAST_VALID_PATH=/tmp/ontology-appliance/last-valid.trig,OA_AUTH_MODE=hybrid,OA_SERVICE_AUDIENCE=https://europe-west4-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net/semanticGatewayHttp,OA_TRUSTED_SERVICE_ACCOUNTS=${{ vars.FUNCTIONS_SERVICE_ACCOUNT }},OA_TENANT_ID=demo-bank,OA_ALLOW_DEMO_CANDIDATE=false,OA_SEMANTIC_TIMEOUT_SECONDS=5,OA_MAX_SEMANTIC_CONCURRENCY=2,VERIFIER_PROVIDER=mock,OPENAI_VERIFIER_MODE=mock,GENERATOR_PROVIDER=mock"
      - name: Restrict gateway invocation to approved runtimes
        shell: bash
        run: |
          policy_file="${RUNNER_TEMP}/semantic-gateway-policy.yaml"
          printf '%s\n' \
            'bindings:' \
            '- role: roles/run.invoker' \
            '  members:' \
            "  - serviceAccount:${{ vars.APPHOSTING_SERVICE_ACCOUNT }}" \
            "  - serviceAccount:${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" \
            "  - serviceAccount:${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}" \
            'version: 1' > "$policy_file"
          gcloud run services set-iam-policy semanticgatewayhttp "$policy_file" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4
      - name: Publish gateway URL for App Hosting
        shell: bash
        run: |
          gateway_url="$(gcloud functions describe semanticGatewayHttp \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-west4 \
            --v2 \
            --format='value(url)')"
          test -n "$gateway_url"
          echo "GATEWAY_URL=$gateway_url" >> "$GITHUB_ENV"
          printf '%s' "$gateway_url" | gcloud secrets versions add oa-dev-semantic-gateway-url \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --data-file=-
      - name: Configure Firebase deployment targets
        if: env.DEPLOYMENT_SCOPE != 'bootstrap'
        shell: bash
        run: |
          pnpm exec firebase target:apply storage input "${{ vars.INPUT_BUCKET }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"
          pnpm exec firebase target:apply storage artifacts "${{ vars.ARTIFACT_BUCKET }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"
          env_file="functions/.env.${{ vars.GCP_PROJECT_ID }}"
          printf '%s\n' \
            "SOURCE_BUCKET=${{ vars.INPUT_BUCKET }}" \
            "FUNCTIONS_SERVICE_ACCOUNT=${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}" \
            'ONTOLOGY_BASE_VERSION=2026.07.1-candidate' \
            'DEFAULT_TENANT_ID=demo-bank' \
            "SEMANTIC_GATEWAY_URL=${GATEWAY_URL}" > "$env_file"
      - name: Deploy Functions and Firebase policy
        if: env.DEPLOYMENT_SCOPE != 'bootstrap'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          pnpm --filter @ontology-appliance/functions build
          pnpm exec firebase deploy \
            --only functions,firestore:rules,firestore:indexes,storage \
            --project "${{ vars.GCP_PROJECT_ID }}"
      - name: Run in-cloud gateway smoke tests
        if: env.DEPLOYMENT_SCOPE != 'bootstrap'
        shell: bash
        env:
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GATEWAY_IMAGE: ${{ vars.ARTIFACT_REGISTRY_IMAGE }}:${{ env.RELEASE_SHA }}
        run: |
          smoke_job="oa-dev-semantic-gateway-smoke"
          cleanup() {
            gcloud run jobs delete "$smoke_job" \
              --project "$GCP_PROJECT_ID" \
              --region europe-west4 \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gcloud run jobs deploy "$smoke_job" \
            --image "$GATEWAY_IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region europe-west4 \
            --service-account "$FUNCTIONS_SERVICE_ACCOUNT" \
            --command python \
            --args=-m,ontology_appliance_gateway.cloud_smoke \
            --set-env-vars "GATEWAY_URL=${GATEWAY_URL},EXPECTED_PUBLICATION_STATE=${EXPECTED_PUBLICATION_STATE}" \
            --tasks 1 \
            --parallelism 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --cpu 1 \
            --memory 512Mi \
            --quiet
          gcloud run jobs execute "$smoke_job" \
            --project "$GCP_PROJECT_ID" \
            --region europe-west4 \
            --wait
          echo "GATEWAY_IN_CLOUD_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Run backend cloud smoke tests
        if: env.DEPLOYMENT_SCOPE == 'backend'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GATEWAY_URL: ${{ env.GATEWAY_URL }}
          INPUT_BUCKET: ${{ vars.INPUT_BUCKET }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}
          REQUIRE_APP_HOSTING: "false"
          RUN_FUNCTIONS_E2E: "true"
        run: bash scripts/smoke_cloud_dev.sh
      - name: Run full cloud smoke tests
        if: env.DEPLOYMENT_SCOPE == 'full'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GATEWAY_URL: ${{ env.GATEWAY_URL }}
          APP_HOSTING_URL: ${{ vars.APP_HOSTING_URL }}
          INPUT_BUCKET: ${{ vars.INPUT_BUCKET }}
          FUNCTIONS_SERVICE_ACCOUNT: ${{ vars.FUNCTIONS_SERVICE_ACCOUNT }}
          REQUIRE_APP_HOSTING: "true"
          RUN_FUNCTIONS_E2E: "true"
        run: bash scripts/smoke_cloud_dev.sh
      - name: Mark partial deployment as not release-ready
        if: env.DEPLOYMENT_SCOPE != 'full'
        run: |
          echo "### ${DEPLOYMENT_SCOPE^} only — not a release GO" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DEPLOYMENT_SCOPE" == "backend" ]]; then
            echo "The private gateway, Functions, Firebase policy, and backend smoke tests passed. Create and verify App Hosting, then run complete configuration and a full deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The gateway URL secret now exists. Create and verify App Hosting, then run complete configuration and a full deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
