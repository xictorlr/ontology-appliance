name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.12.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm --filter @ontology-appliance/web reviews:export --self-test
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"

  semantic-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          version: "0.11.30"
          enable-cache: true
          prune-cache: true
      - working-directory: services/semantic-gateway
        run: uv sync --dev --extra firebase --frozen
      - working-directory: services/semantic-gateway
        run: >-
          uv run ruff check .
          ../../scripts/check_semantic_publication.py
          ../../scripts/export_publication_review.py
          ../../scripts/manage_semantic_rollback.py
      - working-directory: services/semantic-gateway
        run: uv run pytest
      - name: Validate non-published candidate lifecycle
        working-directory: services/semantic-gateway
        run: |
          uv run python ../../scripts/check_semantic_publication.py --self-test
          uv run python ../../scripts/export_publication_review.py --self-test
          uv run python ../../scripts/manage_semantic_rollback.py --self-test
          uv run python ../../scripts/check_semantic_publication.py --mode candidate
      - working-directory: services/semantic-gateway
        run: uv run python ../../scripts/check_contract_drift.py
      - working-directory: services/semantic-gateway
        run: uv run python ../../.agents/skills/serve-semantic-gateway/scripts/validate_openapi.py ../../contracts/openapi.yaml

  contracts-skills-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive infra
      - run: python3 scripts/validate_repo.py
      - name: Test fail-closed deployment guardrails
        run: |
          bash scripts/tests/bootstrap_dev_project_test.sh
          bash scripts/tests/create_apphosting_backend_test.sh
          bash scripts/tests/verify_apphosting_rollout_test.sh
          bash scripts/tests/assert_current_main_test.sh
          bash scripts/tests/resolve_deploy_semantic_mode_test.sh
          bash scripts/tests/rollout_semantic_gateway_test.sh
      - name: Validate Terraform development
        run: |
          terraform -chdir=infra/terraform/environments/dev init -backend=false
          terraform -chdir=infra/terraform/environments/dev validate -no-color
      - name: Validate Terraform production definition
        run: |
          terraform -chdir=infra/terraform/environments/prod init -backend=false
          terraform -chdir=infra/terraform/environments/prod validate -no-color
      - name: Self-test repo-local skills
        run: |
          for script in .agents/skills/*/scripts/*.py; do
            python3 "$script" --self-test
          done
      - name: Ensure production is not provisioned
        run: |
          test ! -f infra/terraform/environments/prod/terraform.tfstate
          grep -Eq '^enable_production[[:space:]]*=[[:space:]]*false$' infra/terraform/environments/prod/terraform.tfvars.example
